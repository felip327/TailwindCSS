<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Mobile First</title>

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style type="text/tailwindcss">
        @variant dark (&:where(.dark, .dark *));
        body { font-family: "Open Sans", sans-serif; }
    </style>
  </head>
  
  <body class="bg-slate-50 transition-colors duration-300 min-h-screen flex flex-col items-center justify-center p-6 antialiased">

   <header class="text-center mb-10">
    <h1 class="text-3xl font-bold text-slate-800 md:text-4xl">
        Bem-vindo(a)
    </h1>
    <p class="text-slate-600 mt-2">
        Insira seus dados de acesso
    </p>
   </header>

   <main class="bg-white p-8 rounded-xl shadow-lg w-full md:w-96 md:mx-auto border border-slate-200 transition-colors duration-300">
        
        <form class="flex flex-col gap-5">
            
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1" for="email">E-mail</label>
                <div class="relative">
                    <i class="bx bxs-user absolute left-3 top-1/2 -translate-y-1/2 text-lg text-slate-400"></i>
                    <input type="email" id="email" placeholder="seu@email.com" class="w-full border border-slate-300 rounded-lg py-2.5 pl-10 pr-3 bg-transparent text-slate-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder:text-slate-400">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1" for="password">Senha</label>
                <div class="relative">
                    <i class="bx bxs-key absolute left-3 top-1/2 -translate-y-1/2 text-lg text-slate-400"></i>
                    <input type="password" id="password" placeholder="************" class="w-full border border-slate-300 rounded-lg py-2.5 pl-10 pr-3 bg-transparent text-slate-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all placeholder:text-slate-400">
                </div>
            </div>

            <div class="flex justify-end -mt-2">
                <a href="#" class="text-sm font-semibold text-blue-600 hover:text-blue-700 transition-colors">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="mt-2 p-3 rounded-lg font-bold cursor-pointer transition-all bg-transparent text-blue-600 border border-blue-600 md:bg-blue-600 md:text-white md:border-transparent md:hover:bg-blue-700">
                Entrar
            </button>
        </form>
    </main>

  </body>
</html>
